name: Quality
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Check browser test collection before expensive validation
        run: npm run test:e2e -- --list
      - run: npm run data:verify
      - run: npm test
      - run: python3 -m unittest discover -s tests/research -p 'test_*.py'
      - run: npm run build
      - name: Record the built revision
        run: node -e "require('node:fs').writeFileSync('dist/revision.json',JSON.stringify({sha:process.env.GITHUB_SHA,version:require('./package.json').version})+'\n')"
      - uses: actions/upload-artifact@v7
        with:
          name: historicmap-build
          path: dist/
          if-no-files-found: error
          compression-level: 1
          retention-days: 7
  browser:
    name: Browser ${{ matrix.shard }}/${{ matrix.shardTotal }}
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
        shardTotal: [8]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: historicmap-build
          path: dist/
      - run: npx playwright install --with-deps chromium
      # Keep one software-rendered WebGL browser per independent machine.
      - run: npm run test:e2e -- --shard=${{ matrix.shard }}/${{ matrix.shardTotal }} --grep-invert @annual-sweep
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: historicmap-browser-${{ matrix.shard }}
          path: test-results/
          compression-level: 1
          retention-days: 7
  annual-sweep:
    name: Browser annual sweep
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: historicmap-build
          path: dist/
      - run: npx playwright install --with-deps chromium
      # This continuous sweep retains one browser/cache across every year.
      - run: npm run test:e2e -- --grep @annual-sweep
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: historicmap-browser-annual-sweep
          path: test-results/
          compression-level: 1
          retention-days: 7
