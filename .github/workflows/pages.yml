name: Publish atlas
on:
  workflow_run:
    workflows: [Quality]
    branches: [main]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    # Publish the exact revision validated by Quality, even when a later
    # documentation-only commit has advanced main without another Quality run.
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Reuse the exact build validated by Quality
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v8
        with:
          name: historicmap-build
          path: dist/
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Check downloaded revision
        if: github.event_name == 'workflow_run'
        env:
          EXPECTED_REVISION: ${{ github.event.workflow_run.head_sha }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          build = json.loads(Path('dist/revision.json').read_text())
          if build['sha'] != os.environ['EXPECTED_REVISION']:
              raise SystemExit('Downloaded build does not match the validated revision')
          if not Path('dist/index.html').is_file():
              raise SystemExit('Downloaded atlas is incomplete')
          PY
      - uses: actions/checkout@v7
        if: github.event_name == 'workflow_dispatch'
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        if: github.event_name == 'workflow_dispatch'
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        if: github.event_name == 'workflow_dispatch'
      - run: npm run build
        if: github.event_name == 'workflow_dispatch'
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
